<!DOCTYPE html>
<html lang="gu">
<head>
    <!-- Firebase App & Firestore SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "TAMARI_API_KEY",
    authDomain: "TAMARI_AUTH_DOMAIN",
    projectId: "TAMARI_PROJECT_ID",
    storageBucket: "TAMARI_STORAGE_BUCKET",
    messagingSenderId: "TAMARI_MESSAGING_SENDER_ID",
    appId: "TAMARI_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - પટેલ સ્વીટ માર્ટ</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- Login Overlay (Fakt Owner Mate) -->
    <div id="login-modal" class="login-overlay">
        <div class="login-box">
            <h2>ઓનર અને એડમિન પોર્ટલ</h2>
            <p>સિંગલ પ્લેસ બિઝનેસ કમાન્ડ અને લાઈવ મેનેજમેન્ટ</p>
            <form id="admin-login-form">
                <input type="text" id="admin-user" placeholder="ઈમેઈલ અથવા યુઝરનેમ" required>
                <input type="password" id="admin-pass" placeholder="પાસ્વર્ડ (Password)" required>
                <button type="submit" class="login-btn">સુરક્ષિત લોગિન કરો (Secure Login)</button>
            </form>
        </div>
    </div>

    <!-- Main Admin Dashboard (Hidden by default until login) -->
    <div id="admin-dashboard" style="display: none;" class="dashboard-container">
        <header>
            <h1>પટેલ સ્વીટ માર્ટ - ઓનર ડેશબોર્ડ</h1>
            <button id="logout-btn" class="logout-btn">લોગઆઉટ</button>
        </header>
        <main>
            <h2>ગ્રાહકોના નવા ઓર્ડર્સ</h2>
            <div id="orders-list">
                <!-- Orders dynamically aavse -->
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
