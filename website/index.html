<!DOCTYPE html>
<html lang="gu" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પટેલ સ્વીટ માર્ટ — Patel Sweet Mart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div>
            <h2 id="store-title" style="margin:0; font-size:18px;" data-en="Patel Sweet Mart" data-gu="પટેલ સ્વીટ માર્ટ">પટેલ સ્વીટ માર્ટ</h2>
        </div>
        <div>
            <button class="lang-btn" onclick="toggleLanguage()">English / ગુજરાતી</button>
            <span style="font-weight: bold; margin-left: 10px;">🛒 <span id="cart-count">0</span></span>
        </div>
    </header>

    <main>
        <section class="products-section">
            <h3 id="sec-heading" data-en="Products" data-gu="વસ્તુઓ">વસ્તુઓ</h3>
            <div class="product-grid">
                
                <!-- Product 1: Toprapak -->
                <div class="product-card">
                    <img src="images/toprapak.jpg" alt="Toprapak" onerror="this.src='logo.png'">
                    <h4 data-en="Toprapak (Green)" data-gu="ટોપરાપાક (લીલો)">ટોપરાપાક (લીલો)</h4>
                    <p>₹500 / kg</p>
                    <select id="weight-toprapak">
                        <option value="1kg">1 kg (₹500)</option>
                        <option value="500g">500 g (₹250)</option>
                        <option value="250g">250 g (₹130)</option>
                    </select>
                    <button class="add-btn" onclick="addCustomToCart('Toprapak', 500, 'weight-toprapak')">
                        <span data-en="Add to Cart" data-gu="કાર્ટમાં ઉમેરો">કાર્ટમાં ઉમેરો</span>
                    </button>
                </div>

                <!-- Product 2: Namkin Sev -->
                <div class="product-card">
                    <img src="images/sev.jpg" alt="Namkin Sev" onerror="this.src='logo.png'">
                    <h4 data-en="Namkin Sev" data-gu="તીખી સેવ">તીખી સેવ</h4>
                    <p>₹180 / kg</p>
                    <select id="weight-sev">
                        <option value="1kg">1 kg (₹180)</option>
                        <option value="500g">500 g (₹90)</option>
                        <option value="250g">250 g (₹45)</option>
                    </select>
                    <button class="add-btn" onclick="addCustomToCart('Namkin Sev', 180, 'weight-sev')">
                        <span data-en="Add to Cart" data-gu="કાર્ટમાં ઉમેરો">કાર્ટમાં ઉમેરો</span>
                    </button>
                </div>

            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
