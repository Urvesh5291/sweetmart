<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- 1. LOGIN FORM -->
        <div id="login-form" class="form-container active">
            <div class="form-box">
                <h2>Login</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label>Username / Email</label>
                        <input type="text" id="login-user" required placeholder="Tamaru user name nakho">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="login-pass" required placeholder="Password nakho">
                    </div>
                    <button type="submit" class="btn">Login</button>
                    <p id="login-msg" class="message" style="color: red;"></p>
                    <p class="form-text">Password bhuli gaya? <a href="#" onclick="showForm('forgot-form')">Forget Password</a></p>
                    <p class="form-text">Account nathi? <a href="#" onclick="showForm('signup-form')">Signup karo</a></p>
                </form>
            </div>
        </div>

        <!-- 2. SIGNUP FORM -->
        <div id="signup-form" class="form-container">
            <div class="form-box">
                <h2>Signup</h2>
                <form onsubmit="handleSignup(event)">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="signup-user" required placeholder="User name banavo">
                    </div>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="signup-email" required placeholder="Email id nakho">
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="signup-pass" required placeholder="Strong password nakho">
                    </div>
                    <button type="submit" class="btn">Register</button>
                    <p id="signup-msg" class="message" style="color: red;"></p>
                    <p class="form-text">Already account che? <a href="#" onclick="showForm('login-form')">Login karo</a></p>
                </form>
            </div>
        </div>

        <!-- 3. FORGET PASSWORD FORM -->
        <div id="forgot-form" class="form-container">
            <div class="form-box">
                <h2>Reset Password</h2>
                <form onsubmit="handleForgot(event)">
                    <div class="input-group">
                        <label>Registered Email</label>
                        <input type="email" id="forgot-email" required placeholder="Tamaro registered email nakho">
                    </div>
                    <div class="input-group">
                        <label>New Password</label>
                        <input type="password" id="new-pass" required placeholder="Navo password nakho">
                    </div>
                    <button type="submit" class="btn">Update Password</button>
                    <p id="forgot-msg" class="message" style="color: red;"></p>
                    <p class="form-text"><a href="#" onclick="showForm('login-form')">Back to Login</a></p>
                </form>
            </div>
        </div>

        <!-- 4. DASHBOARD (After Login Success) -->
        <div id="dashboard" class="form-container">
            <div class="form-box" style="text-align: center;">
                <h2>Welcome! 🎉</h2>
                <p style="margin: 20px 0; color: #555;">Tame safaltapurvak login thai gaya cho.</p>
                <h3 id="user-display" style="color: #667eea; margin-bottom: 20px;"></h3>
                <button onclick="handleLogout()" class="btn" style="background: #e74c3c;">Logout</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
